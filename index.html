<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Porch Logic Shop</title>
</head>
<body>
<main>
<header>
  <h1>SHOP</h1>
  <a href="../cart/" class="cart-icon" aria-label="View cart">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M7 18c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zm9 0c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zM6.2 6l-.3-1.2A1 1 0 0 0 5 4H3a1 1 0 1 0 0 2h1.3l2 8.2A1 1 0 0 0 7.3 15h9.8a1 1 0 0 0 1-.8l1.2-6A1 1 0 0 0 18.3 7H7.1L6.8 6z" />
  </svg>
  <span class="cart-count-badge" data-cart-count>0</span>
</a>
</header>
<section class="product-grid">
<a class="product-card" href="/m8-plate/">
  <section class="hero">
    <div class="pl-carousel__slide is-active">
      <img src="/images/m8-plate-3_smoke.png" alt="M8 Plate">
    </div>
  </section>
  <h2>M8 Plate</h2>
  <section class="cta"></section>
</a>
<a class="product-card" href="/m8-backpack/">
  <section class="hero">
    <div class="pl-carousel__slide is-active">
      <img src="/images/m8-backpack-hero1_smoke.png" alt="M8 Backpack">
    </div>
  </section>
  <h2>M8 Backpack</h2>
  <section class="cta"></section>
</a>
<a class="product-card" href="/m8-kit/">
  <section class="hero">
    <div class="pl-carousel__slide is-active">
      <img src="/images/m8_kit_1.png" alt="M8 Kit">
    </div>
  </section>
  <h2>M8 Kit</h2>
  <section class="cta"></section>
</a>
</section>
<div class="porch-logic-mark">porchLogic</div>
</main>
<div id="glyph-modal" class="glyph-modal hidden">
  <div class="glyph-modal-inner card">
    <header class="glyph-modal-header">
      <h2>Custom AM8 Glyph</h2>
    </header>
    <p class="glyph-modal-subtitle">Sculpt your glyph by clicking and dragging.</p>
    <div id="glyph-modal-editor" class="glyph-modal-editor"></div>
    <button type="button" class="glyph-modal-close" aria-label="Close glyph editor">Close</button>
  </div>
</div>
<dialog id="cart-popup" aria-labelledby="cart-popup-title">
  <article>
    <header>
      <h2 id="cart-popup-title">Cart updated</h2>
    </header>
    <p id="popup-message"></p>
    <footer>
      <button type="button" class="secondary" data-close-cart>Keep browsing</button>
      <a href="../cart/" role="button">Go to cart</a>
    </footer>
  </article>
</dialog>
<script src="/runtime/shop.js"></script>
</body>
</html>
