<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>M8 PLATE Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="carousel.css" />
    <link rel="stylesheet" href="/porch-logic.css" />
    <style>
        :root {
            --bg: #e3e3e3;
            --border: #bababa;
            --text-main: #111;
            --text-muted: #777;
            --text-link: rgb(97, 144, 160);
            --accent: #ff9a2c;
            --base1: #d3cbbf;
            --base2: #b8b0a6;
            --base3: #8e8983;
            --card-vertical-factor: 1.9;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        @font-face {
            font-family: "stealth57";
            src: url("../fonts/stealth57.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* height: 100%; */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2.25rem 1.25rem 1.75rem 2.4rem;
            background:
                radial-gradient(ellipse at center,
                    rgba(40, 40, 40, 0.15) 0%,
                    rgba(70, 70, 70, 0.15) 30%,
                    rgba(110, 105, 100, 0.15) 65%,
                    rgba(150, 145, 140, 0.15) 100%),
                linear-gradient(to bottom,
                    rgba(180, 175, 168, 0.35) 0%,
                    rgba(120, 115, 110, 0.15) 60%,
                    rgba(60, 55, 50, 0.10) 100%);
            background-blend-mode: soft-light, normal;
        }

        main {
            width: min(100vw - 2rem,
                    calc((100vh - 2rem) / var(--card-vertical-factor)));
            max-width: 480px;
            border-radius: 0.75rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);

        }

        @supports (height: 100dvh) {
            main {
                width: min(100vw - 2rem,
                        calc((100dvh - 2rem) / var(--card-vertical-factor)));
            }
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding-inline: 0.25rem;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.25rem;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 6vw, 2.75rem);
            letter-spacing: 0.12em;
            /* font-family: "stealth57", sans-serif; */
            color: var(--text-muted);
            text-align: left;
            white-space: nowrap;
            padding: 0.5rem 0 0.25rem;
        }

        .page-footer {
            position: fixed;
            bottom: 8px;
            left: 3px;
            transform: translateY(100%) rotate(-90deg);
            transform-origin: top left;
            font-size: 0.75rem;
        }

        .shop-link {
            display: inline-block;
            padding: 0.1rem 0;
            text-decoration: none;
            text-decoration-thickness: 1px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-main);
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .shop-link__icon {
            width: 1rem;
            height: 1rem;
        }

        .hero {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-link {
            align-self: flex-end;
            margin-right: 0.25rem;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-link);
            display: inline-flex;
            gap: 0.35rem;
            align-items: center;
        }

        .video-link::after {
            content: "›";
            font-size: 1rem;
            line-height: 1;
        }

        section.attributes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-left: 1px solid var(--border);
            border-top: 1px solid var(--border);
        }

        .attribute {
            padding: 0.9rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            text-align: left;
            gap: 0.4rem;
        }

        .attribute__label {
            margin: 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-muted);
        }

        .attribute__primary-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .attribute__secondary-text {
            margin-top: 0.15rem;
            font-size: 0.8rem;
            letter-spacing: 0.16em;
            text-transform: lowercase;
            color: var(--text-muted);
        }

        .attribute__value {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .attribute__value--choices {
            flex-direction: row;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: flex-start;
            width: 100%;
        }

        .chip {
            padding: 0.35rem 0.6rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.7rem;
            color: var(--text-muted);
            background-color: #bfbfbf12;
            cursor: pointer;
        }

        .chip--selected {
            background: var(--accent);
            color: #111;
            border-color: #cfcfcf;
            box-shadow: inset 0 0 0 2px #cfcfcf;
        }

        .attribute__value--glyph {
            flex-direction: row;
            align-items: center;
            gap: 0.75rem 1rem;
            justify-content: flex-start;
            width: 100%;
            flex-wrap: wrap;
        }

        .attribute__value--choices > *,
        .attribute__value--glyph > * {
            flex: 0 0 auto;
        }

        .toggle {
            position: relative;
            width: 3rem;
            height: 1.6rem;
            border-radius: 999px;
            background: #626263;
            border: 1px solid #cfd5de;
            display: inline-flex;
            align-items: center;
            padding: 0 0.15rem;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }

        .toggle.is-on {
            background: #ffb05a;
            border-color: #ffb05a;
        }

        .toggle__knob {
            width: 1.05rem;
            height: 1.05rem;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transform: translateX(0);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .toggle.is-on .toggle__knob {
            transform: translateX(1.2rem);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .glyph-thumb {
            width: 3.8rem;
            height: 3.8rem;
            border-radius: 0.25rem;
            border: 1px solid var(--border);
            background-color: #f7f7f7;
            /* background-image: repeating-linear-gradient(135deg,
                    #d0d0d0 0,
                    #d0d0d0 4px,
                    #f7f7f7 4px,
                    #f7f7f7 8px); */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .glyph-thumb .glyph-icon-canvas {
            width: 100%;
            height: 100%;
        }

        .glyph-thumb.is-disabled {
            opacity: 0.1;
            cursor: not-allowed;
            pointer-events: none;
        }

        section.cta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            text-align: center;
            padding: 0.6rem 0.25rem 1.25rem 0.25rem;
        }

        section.keycaps {
            border: 1px solid var(--border);
            padding: 0.75rem 1rem 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .keycaps__header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .keycaps__label {
            margin: 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-muted);
        }

        .keycaps__note {
            margin: 0;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .keycaps__rows {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .keycaps__row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.45rem 0.2rem;
            border-top: 1px solid var(--border);
        }

        .keycaps__row:first-child {
            border-top: none;
        }

        .keycaps__row.is-zero {
            opacity: 0.5;
        }

        .keycaps__name {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .keycaps__meta {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .stepper {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.15rem 0.45rem;
            background: rgba(255, 255, 255, 0.35);
        }

        .stepper__btn {
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0.2rem 0.35rem;
        }

        .stepper__btn:disabled {
            cursor: not-allowed;
            opacity: 0.35;
        }

        .stepper__input {
            width: 2.1rem;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            outline: none;
        }

        .stepper__input::-webkit-outer-spin-button,
        .stepper__input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .cta__price {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 0.45rem;
            justify-content: center;
        }

        .price {
            font-size: 1.5rem;
            letter-spacing: 0.12em;
        }

        .price--original {
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: line-through;
            letter-spacing: 0.08em;
        }

        .price-note {
            font-size: 1.0rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .buy {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 2rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .cart-icon {
            position: relative;
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(243, 243, 243, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 2;
        }

        .cart-icon svg {
            width: 1.2rem;
            height: 1.2rem;
            fill: var(--text-main);
        }

        .cart-count-badge {
            position: absolute;
            top: -0.3rem;
            right: -0.4rem;
            min-width: 1.2rem;
            height: 1.2rem;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.1rem 0.35rem;
            line-height: 1;
        }

        /* modal + utility */
        .hidden {
            display: none !important;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .is-disabled,
        button[disabled],
        .buy[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
        }

        .glyph-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 10, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            z-index: 20;
        }

        .glyph-modal.visible {
            display: flex;
        }

        .glyph-modal-inner {
            width: min(960px, 92vw);
            max-height: 92vh;
            overflow: auto;
            background: #0b0d11;
            color: #f4f6fb;
            border: 1px solid #1f242c;
            border-radius: 14px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            padding: 1.25rem 1.35rem 1.5rem;
        }

        .glyph-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .glyph-modal-subtitle {
            color: #b7c0cc;
            margin: 0.35rem 0 0.5rem;
            font-size: 0.95rem;
        }

        .glyph-modal-editor {
            margin-top: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        dialog#cart-popup {
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        dialog#cart-popup::backdrop {
            background: rgba(0, 0, 0, 0.35);
        }

        dialog#cart-popup article {
            padding: 1rem 1.2rem 1.2rem;
        }

        dialog#cart-popup header h2 {
            margin: 0 0 0.4rem;
            font-size: 1.1rem;
        }

        dialog#cart-popup footer {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        dialog#cart-popup button,
        dialog#cart-popup a {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            text-align: center;
            text-decoration: none;
            background: #f7f7f7;
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        dialog#cart-popup a {
            background: var(--accent);
            color: #111;
            border-color: #cfcfcf;
            box-shadow: inset 0 0 0 2px #cfcfcf;
        }

        @media (max-width: 480px) {
            body {
                padding: 1.25rem 0.75rem 1.35rem 1.65rem;
                overflow-y: auto;
                height: 100svh;
                min-height: 100svh;
            }

            main {
                padding: 0.75rem;
                gap: 0.75rem;
                height: auto;
                min-height: 0;
                max-height: none;
                width: 100vw;
                max-width: 100vw;
                border-radius: 0;
                box-shadow: none;
            }

            .attribute {
                padding: 0.75rem 0.8rem;
            }

            .buy {
                width: 100%;
            }

            .cta__price {
                align-items: center;
            }
        }

        @media (max-height: 820px) {
            body {
                align-items: flex-start;
            }

            main {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div class="header-left">
                <a href="../" class="shop-link" aria-label="Back to shop">
                    &lt; Shop
                </a>
                <h1>M8 PLATE</h1>
            </div>
            <a href="../cart/" class="cart-icon" aria-label="View cart">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                        d="M7 18c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zm9 0c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zM6.2 6l-.3-1.2A1 1 0 0 0 5 4H3a1 1 0 1 0 0 2h1.3l2 8.2A1 1 0 0 0 7.3 15h9.8a1 1 0 0 0 1-.8l1.2-6A1 1 0 0 0 18.3 7H7.1L6.8 6z" />
                </svg>
                <span class="cart-count-badge" data-cart-count>0</span>
            </a>
        </header>

        <section class="hero">
            <div class="pl-carousel" data-carousel>
                <div class="pl-carousel__track" data-carousel-track>
                    <div class="pl-carousel__slide is-active">
                        <img src="/images/m8-plate-3.png" alt="M8 PLATE photo 1">
                    </div>
                    <div class="pl-carousel__slide">
                        <img src="/images/m8-plate-4.png" alt="M8 PLATE photo 2">
                    </div>
                </div>

                <button class="pl-carousel__arrow pl-carousel__arrow--prev" data-carousel-prev>
                    ‹
                </button>
                <button class="pl-carousel__arrow pl-carousel__arrow--next" data-carousel-next>
                    ›
                </button>

                <div class="pl-carousel__dots" data-carousel-dots></div>
            </div>
        </section>

        <a class="video-link" href="https://www.youtube.com/watch?v=RU58WwQE1nQ&t=2s" target="_blank"
            rel="noreferrer noopener">
            video
        </a>

        <section class="attributes">
            <div class="attribute attribute--material">
                <h2 class="attribute__label">Material</h2>
                <div class="attribute__value">
                    <span class="attribute__primary-text">PETG</span>
                </div>
            </div>

            <div class="attribute attribute--color">
                <h2 class="attribute__label">Color</h2>
                <div class="attribute__value attribute__value--choices">
                    <button class="chip chip--selected" type="button" aria-pressed="true" data-color="Smoke">
                        Smoke
                    </button>
                    <button class="chip" type="button" aria-pressed="false" data-color="Clear">
                        Clear
                    </button>
                </div>
            </div>

            <div class="attribute attribute--glyph">
                <h2 class="attribute__label">+ Custom Glyph</h2>
                <div class="attribute__value attribute__value--glyph">
                    <button class="toggle" type="button" aria-pressed="false" aria-label="Toggle custom glyph"
                        id="glyph-toggle">
                        <span class="toggle__knob"></span>
                    </button>
                    <button class="glyph-thumb is-disabled" type="button" aria-label="Edit custom glyph"
                        aria-disabled="true" id="glyph-thumb" tabindex="-1">
                        <canvas class="glyph-icon-canvas" width="160" height="80" id="glyph-thumb-canvas"></canvas>
                    </button>
                </div>
            </div>

            <div class="attribute attribute--for">
                <h2 class="attribute__label">For</h2>
                <div class="attribute__value">
                    <span class="attribute__primary-text">M8 TRACKER</span>
                    <span class="attribute__secondary-text">model:01</span>
                </div>
            </div>
        </section>

        <section class="keycaps" aria-label="Keycaps add-on">
            <div class="keycaps__header">
                <h2 class="keycaps__label">Add keycaps</h2>
                <p class="keycaps__note">$1 each</p>
            </div>
            <div class="keycaps__rows">
                <div class="keycaps__row is-zero" data-keycap-row="Smoke">
                    <div>
                        <div class="keycaps__name">Smoke</div>
                        <div class="keycaps__meta">Keycaps</div>
                    </div>
                    <div class="stepper" data-keycap="Smoke">
                        <button type="button" class="stepper__btn" data-step="-1"
                            aria-label="Decrease smoke keycaps">
                            ▼
                        </button>
                        <input type="number" class="stepper__input" min="0" max="8" value="0" inputmode="numeric"
                            aria-label="Smoke keycaps quantity">
                        <button type="button" class="stepper__btn" data-step="1"
                            aria-label="Increase smoke keycaps">
                            ▲
                        </button>
                    </div>
                </div>
                <div class="keycaps__row is-zero" data-keycap-row="Clear">
                    <div>
                        <div class="keycaps__name">Clear</div>
                        <div class="keycaps__meta">Keycaps</div>
                    </div>
                    <div class="stepper" data-keycap="Clear">
                        <button type="button" class="stepper__btn" data-step="-1"
                            aria-label="Decrease clear keycaps">
                            ▼
                        </button>
                        <input type="number" class="stepper__input" min="0" max="8" value="0" inputmode="numeric"
                            aria-label="Clear keycaps quantity">
                        <button type="button" class="stepper__btn" data-step="1"
                            aria-label="Increase clear keycaps">
                            ▲
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="cta">
            <div class="cta__price">
                <!-- <span class="price-note">🎄 25% OFF!</span> -->
                <div class="price-row">
                    <!-- <span class="price price--original">$32</span> -->
                    <span class="price">$24</span>
                </div>
            </div>
            <button type="button" class="buy" id="add-to-cart">
                Add to cart
            </button>
        </section>
        <div class="porch-logic-mark">porchLogic</div>
    </main>

    <footer class="page-footer">
        &copy; 2025 Porch Logic
    </footer>

    <!-- Full-screen glyph editor modal -->
    <div id="glyph-modal" class="glyph-modal hidden">
        <div class="glyph-modal-inner card">
            <header class="glyph-modal-header">
                <h2>Custom AM8 Glyph</h2>
            </header>
            <p class="glyph-modal-subtitle">
                Sculpt your glyph by clicking and dragging. Right-click to flatten segments.
            </p>
            <div id="glyph-modal-editor" class="glyph-modal-editor"></div>
            <button type="button" class="glyph-modal-close" aria-label="Close glyph editor">
                Close
            </button>
        </div>
    </div>

    <dialog id="cart-popup" aria-labelledby="cart-popup-title">
        <article>
            <header>
                <h2 id="cart-popup-title">Cart updated</h2>
            </header>
            <p id="popup-message"></p>
            <footer>
                <button type="button" class="secondary" data-close-cart>
                    Keep browsing
                </button>
                <a href="../cart/" role="button">Go to cart</a>
            </footer>
        </article>
    </dialog>

    <script src="../cart/cart.js"></script>
    <script>
        (function () {
            document.addEventListener('DOMContentLoaded', function () {
                const carousel = initCarousel(document.querySelector('[data-carousel]'));
                initProduct(carousel);
                wireCartPopup();
            });

            function initCarousel(root) {
                if (!root) return null;

                const track = root.querySelector('[data-carousel-track]');
                const slides = Array.from(root.querySelectorAll('.pl-carousel__slide'));
                const prevBtn = root.querySelector('[data-carousel-prev]');
                const nextBtn = root.querySelector('[data-carousel-next]');
                const dotsContainer = root.querySelector('[data-carousel-dots]');
                if (!track || slides.length === 0) return null;

                let currentIndex = 0;
                const images = Array.from(root.querySelectorAll('.pl-carousel__slide img'));
                const baseImageSources = images.map((img) => img.getAttribute('src') || '');

                const dots = slides.map((_, index) => {
                    const btn = document.createElement('button');
                    if (index === 0) btn.classList.add('is-active');
                    btn.addEventListener('click', function () {
                        goToSlide(index);
                    });
                    dotsContainer.appendChild(btn);
                    return btn;
                });

                function updateUI() {
                    track.style.transform = `translateX(-${currentIndex * 100}%)`;
                    slides.forEach((s, i) => s.classList.toggle('is-active', i === currentIndex));
                    dots.forEach((d, i) => d.classList.toggle('is-active', i === currentIndex));
                }

                function goToSlide(index) {
                    const count = slides.length;
                    currentIndex = (index + count) % count;
                    updateUI();
                }

                function applySuffix(src, suffix) {
                    if (!src) return '';
                    const [path, query = ''] = src.split('?');
                    const dotIndex = path.lastIndexOf('.');
                    const hasExtension = dotIndex > path.lastIndexOf('/');
                    const suffixPart = suffix ? `_${suffix}` : '';
                    const nextPath = hasExtension
                        ? `${path.slice(0, dotIndex)}${suffixPart}${path.slice(dotIndex)}`
                        : `${path}${suffixPart}`;
                    return query ? `${nextPath}?${query}` : nextPath;
                }

                function setColorVariant(color) {
                    const suffix = (color || '').toLowerCase();
                    images.forEach((img, idx) => {
                        const baseSrc = baseImageSources[idx];
                        if (!baseSrc) return;
                        img.src = applySuffix(baseSrc, suffix);
                    });
                    updateUI();
                }

                function next() { goToSlide(currentIndex + 1); }
                function prev() { goToSlide(currentIndex - 1); }

                if (prevBtn) prevBtn.addEventListener('click', prev);
                if (nextBtn) nextBtn.addEventListener('click', next);

                let startX = 0;
                let currentX = 0;
                let isDragging = false;
                const swipeThreshold = 40;

                function onTouchStart(e) {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    currentX = startX;
                    isDragging = true;
                }
                function onTouchMove(e) {
                    if (!isDragging) return;
                    const touch = e.touches[0];
                    currentX = touch.clientX;
                }
                function onTouchEnd() {
                    if (!isDragging) return;
                    const deltaX = currentX - startX;
                    if (Math.abs(deltaX) > swipeThreshold) {
                        if (deltaX < 0) next();
                        else prev();
                    }
                    isDragging = false;
                }

                track.addEventListener('touchstart', onTouchStart, { passive: true });
                track.addEventListener('touchmove', onTouchMove, { passive: true });
                track.addEventListener('touchend', onTouchEnd);

                return {
                    setColorVariant,
                };
            }

            function initProduct(carouselApi) {
                const PRODUCT = {
                    id: 'm8_plate_1',
                    name: 'M8 PLATE',
                    price: 24.0,
                    material: 'PETG',
                };
                const allowedColors = ['Smoke', 'Clear'];
                const queryColor = new URLSearchParams(window.location.search).get('color');
                const initialColor =
                    allowedColors.find(
                        (c) => c.toLowerCase() === (queryColor || '').trim().toLowerCase()
                    ) || 'Smoke';

                const colorButtons = Array.from(
                    document.querySelectorAll('[data-color]')
                );
                const glyphToggle = document.getElementById('glyph-toggle');
                const glyphThumb = document.getElementById('glyph-thumb');
                const glyphCanvas = document.getElementById('glyph-thumb-canvas');
                const buyButton = document.getElementById('add-to-cart');
                const keycapSteppers = Array.from(
                    document.querySelectorAll('.stepper[data-keycap]')
                );
                const priceDisplay = document.querySelector('.cta__price .price');

                const state = {
                    color: '',
                    customGlyphEnabled: false,
                    glyphData: null,
                    showOnLive: false,
                    keycaps: {
                        Smoke: 0,
                        Clear: 0,
                    },
                };

                const updatePriceDisplay = () => {
                    if (!priceDisplay) return;
                    const keycapTotal =
                        (state.keycaps.Smoke || 0) + (state.keycaps.Clear || 0);
                    const total = PRODUCT.price + keycapTotal * 1.0;
                    priceDisplay.textContent = `$${total.toFixed(2)}`;
                };

                const setColor = (color) => {
                    const nextColor = color || 'Smoke';
                    const changed = state.color !== nextColor;
                    state.color = nextColor;
                    colorButtons.forEach((btn) => {
                        const isActive = btn.dataset.color === nextColor;
                        btn.classList.toggle('chip--selected', isActive);
                        btn.setAttribute('aria-pressed', String(isActive));
                    });
                    if (changed && carouselApi && typeof carouselApi.setColorVariant === 'function') {
                        carouselApi.setColorVariant(nextColor);
                    }
                };

                colorButtons.forEach((btn) => {
                    btn.addEventListener('click', () => {
                        setColor(btn.dataset.color || 'Smoke');
                    });
                });

                const renderThumb = () => {
                    if (glyphCanvas && typeof renderGlyphThumbnail === 'function') {
                        renderGlyphThumbnail(glyphCanvas, state.glyphData);
                    }
                };

                const syncGlyphUI = () => {
                    if (!glyphToggle) return;
                    const enabled = state.customGlyphEnabled;
                    glyphToggle.classList.toggle('is-on', enabled);
                    glyphToggle.setAttribute('aria-pressed', String(enabled));

                    if (glyphThumb) {
                        glyphThumb.classList.toggle('is-disabled', !enabled);
                        glyphThumb.setAttribute('aria-disabled', String(!enabled));
                        glyphThumb.tabIndex = enabled ? 0 : -1;
                    }

                    if (enabled) {
                        renderThumb();
                    }
                };

                const openGlyphEditor = () => {
                    if (
                        typeof attachMoundGrid !== 'function' ||
                        typeof renderGlyphThumbnail !== 'function'
                    ) {
                        return;
                    }

                    const glyphModal = document.getElementById('glyph-modal');
                    const glyphModalEditor = document.getElementById('glyph-modal-editor');
                    if (!glyphModal || !glyphModalEditor) return;

                    glyphModal.classList.remove('hidden');
                    glyphModal.classList.add('visible');

                    attachMoundGrid('m8-product-config', glyphModalEditor, state.glyphData || null, {
                        onDataChange: (data) => {
                            state.glyphData = data;
                        },
                        onThumbnailUpdate: (data) => {
                            state.glyphData = data;
                            renderThumb();
                        },
                    });
                };

                if (glyphToggle) {
                    glyphToggle.addEventListener('click', () => {
                        state.customGlyphEnabled = !state.customGlyphEnabled;
                        syncGlyphUI();
                    });
                }

                if (glyphThumb) {
                    glyphThumb.addEventListener('click', () => {
                        if (!state.customGlyphEnabled) return;
                        openGlyphEditor();
                    });
                }

                const clampKeycaps = (value) => {
                    const parsed = Number(value);
                    if (!Number.isFinite(parsed)) return 0;
                    return Math.min(8, Math.max(0, Math.floor(parsed)));
                };

                const syncKeycapUI = (color) => {
                    const count = state.keycaps[color] || 0;
                    const stepper = keycapSteppers.find(
                        (el) => el.dataset.keycap === color
                    );
                    if (!stepper) return;
                    const row = document.querySelector(`[data-keycap-row="${color}"]`);
                    const input = stepper.querySelector('.stepper__input');
                    const down = stepper.querySelector('[data-step="-1"]');
                    const up = stepper.querySelector('[data-step="1"]');
                    if (input) input.value = String(count);
                    if (down) down.disabled = count <= 0;
                    if (up) up.disabled = count >= 8;
                    if (row) row.classList.toggle('is-zero', count === 0);
                };

                const setKeycapCount = (color, value) => {
                    state.keycaps[color] = clampKeycaps(value);
                    syncKeycapUI(color);
                    updatePriceDisplay();
                };

                keycapSteppers.forEach((stepper) => {
                    const color = stepper.dataset.keycap;
                    const input = stepper.querySelector('.stepper__input');
                    const buttons = stepper.querySelectorAll('[data-step]');

                    buttons.forEach((btn) => {
                        btn.addEventListener('click', () => {
                            const step = Number(btn.dataset.step || 0);
                            setKeycapCount(color, (state.keycaps[color] || 0) + step);
                        });
                    });

                    if (input) {
                        input.addEventListener('change', () => {
                            setKeycapCount(color, input.value);
                        });
                        input.addEventListener('blur', () => {
                            setKeycapCount(color, input.value);
                        });
                    }

                    setKeycapCount(color, state.keycaps[color] || 0);
                });

                if (buyButton) {
                    buyButton.addEventListener('click', () => {
                        const item = {
                            ...PRODUCT,
                            quantity: 1,
                            color: state.color,
                            customGlyphEnabled: state.customGlyphEnabled,
                            glyphData: state.glyphData,
                            showOnLive: state.showOnLive,
                        };
                        if (typeof addItemToCart === 'function') {
                            addItemToCart(item);
                        }

                        const keycapItems = [];
                        const keycapConfigs = [
                            { color: 'Smoke', id: 'm8_keycap_smoke' },
                            { color: 'Clear', id: 'm8_keycap_clear' },
                        ];

                        keycapConfigs.forEach((cfg) => {
                            const count = state.keycaps[cfg.color] || 0;
                            if (count <= 0) return;
                            const keycapItem = {
                                id: cfg.id,
                                name: 'M8 Keycap',
                                price: 1.0,
                                quantity: count,
                                color: cfg.color,
                            };
                            keycapItems.push(keycapItem);
                            if (typeof addItemToCart === 'function') {
                                addItemToCart(keycapItem);
                            }
                        });

                        if (typeof showCartPopup === 'function') {
                            const keycapLine = keycapItems
                                .map((k) => `${k.quantity} ${k.color.toLowerCase()} keycaps`)
                                .join(', ');
                            const message = keycapLine
                                ? `${item.name} added to cart. + ${keycapLine}.`
                                : `${item.name} added to cart.`;
                            showCartPopup(message);
                        }
                    });
                }

                setColor(initialColor);
                syncGlyphUI();
                updatePriceDisplay();
            }

            function wireCartPopup() {
                const cartPopup = document.getElementById('cart-popup');
                const closeCartBtn = document.querySelector('[data-close-cart]');
                if (cartPopup && closeCartBtn) {
                    closeCartBtn.addEventListener('click', hideCartPopup);
                    cartPopup.addEventListener('cancel', (event) => {
                        event.preventDefault();
                        hideCartPopup();
                    });
                }
            }
        })();
    </script>
</body>

</html>
