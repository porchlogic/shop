<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Porch Logic Shop</title>
</head>
<body>
<main>
<header>
  <div class="header-left">
    <a href="../" class="shop-link" aria-label="Back to shop">&lt; Shop</a>
    <h1>M8 PLATE</h1>
  </div>
  <a href="../cart/" class="cart-icon" aria-label="View cart">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M7 18c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zm9 0c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1zM6.2 6l-.3-1.2A1 1 0 0 0 5 4H3a1 1 0 1 0 0 2h1.3l2 8.2A1 1 0 0 0 7.3 15h9.8a1 1 0 0 0 1-.8l1.2-6A1 1 0 0 0 18.3 7H7.1L6.8 6z" />
  </svg>
  <span class="cart-count-badge" data-cart-count>0</span>
</a>
</header>
<script type="application/json" id="product-data">{"id":"m8_plate_1","name":"M8 Plate","price":24,"images":["m8-plate-3_smoke.png","m8-plate-4.png"],"variants":["smoke","clear"],"type":"","attributes":{"material":{"type":"fixed","value":"PETG"},"color":{"type":"options","options":["smoke","clear"]},"custom_glyph":{"type":"toggle","label":"+ Custom Glyph"},"compatible_device":{"type":"fixed","value":{"name":"M8 Tracker","model":"model:01"}}},"add_ons":{"keycaps":{"price_each":1,"colors":["smoke","clear"],"product_ids":["m8_keycap_smoke","m8_keycap_clear"]}},"image_variants":{"1":{"for":["smoke"],"image":"m8-plate-3_smoke.png"},"2":{"for":["clear"],"image":"m8-plate-3_clear.png"}},"images_base_url":"/images"}</script>
<section class="hero">
  <div class="pl-carousel" data-carousel>
    <div class="pl-carousel__track" data-carousel-track>
      <div class="pl-carousel__slide is-active">
        <img src="/images/m8-plate-3_smoke.png" alt="">
      </div>
      <div class="pl-carousel__slide">
        <img src="/images/m8-plate-4.png" alt="">
      </div>
    </div>
    <button class="pl-carousel__arrow pl-carousel__arrow--prev" data-carousel-prev>&lt;</button>
    <button class="pl-carousel__arrow pl-carousel__arrow--next" data-carousel-next>&gt;</button>
    <div class="pl-carousel__nav">
      <span class="pl-carousel__order-label hidden" data-carousel-order-label>your order ↓</span>
      <div class="pl-carousel__dots" data-carousel-dots></div>
    </div>
  </div>
</section>
<a href="https://www.youtube.com/watch?v=RU58WwQE1nQ&t=2s" class="product-video-link">Video</a>
<section class="attributes">
<div class="attribute attribute--material">
  <h2 class="attribute__label">Material</h2>
  <div class="attribute__value">
    <span class="attribute__primary-text">PETG</span>
  </div>
</div>
<div class="attribute attribute--color">
  <h2 class="attribute__label">Color</h2>
  <div class="attribute__value attribute__value--choices">
    <button class="chip chip--selected" type="button" aria-pressed="true" data-attribute="color" data-value="smoke" data-color="Smoke">Smoke</button>
    <button class="chip" type="button" aria-pressed="false" data-attribute="color" data-value="clear" data-color="Clear">Clear</button>
  </div>
</div>
<div class="attribute attribute--custom_glyph">
  <h2 class="attribute__label">+ Custom Glyph</h2>
  <div class="attribute__value attribute__value--glyph">
    <button class="toggle" type="button" aria-pressed="false" aria-label="Toggle + Custom Glyph" data-attribute="custom_glyph" data-glyph-toggle="true">
      <span class="toggle__knob"></span>
    </button>
    <button class="glyph-thumb is-disabled" type="button" aria-label="Edit custom glyph" aria-disabled="true" data-glyph-thumb="true" tabindex="-1">
      <span class="glyph-thumb__edit">Edit</span>
      <canvas class="glyph-icon-canvas" width="160" height="80" data-glyph-canvas="true"></canvas>
    </button>
  </div>
</div>
<div class="attribute attribute--for">
  <h2 class="attribute__label">For</h2>
  <div class="attribute__value">
    <span class="attribute__primary-text">M8 TRACKER</span>
    <span class="attribute__secondary-text">model:01</span>
  </div>
</div>
</section>
<section class="keycaps" aria-label="Keycaps add-on">
  <div class="keycaps__header">
    <h2 class="keycaps__label">Add keycaps</h2>
    <p class="keycaps__note">$1 each</p>
  </div>
  <div class="keycaps__rows">
  <div class="keycaps__row is-zero" data-keycap-row="Smoke">
    <div>
      <div class="keycaps__name">Smoke</div>
      <div class="keycaps__meta">Keycaps</div>
    </div>
    <div class="stepper" data-keycap="Smoke">
      <button type="button" class="stepper__btn" data-step="-1" aria-label="Decrease smoke keycaps">
        &#9660;
      </button>
      <input type="number" class="stepper__input" min="0" max="8" value="0" inputmode="numeric" aria-label="Smoke keycaps quantity">
      <button type="button" class="stepper__btn" data-step="1" aria-label="Increase smoke keycaps">
        &#9650;
      </button>
    </div>
  </div>
  <div class="keycaps__row is-zero" data-keycap-row="Clear">
    <div>
      <div class="keycaps__name">Clear</div>
      <div class="keycaps__meta">Keycaps</div>
    </div>
    <div class="stepper" data-keycap="Clear">
      <button type="button" class="stepper__btn" data-step="-1" aria-label="Decrease clear keycaps">
        &#9660;
      </button>
      <input type="number" class="stepper__input" min="0" max="8" value="0" inputmode="numeric" aria-label="Clear keycaps quantity">
      <button type="button" class="stepper__btn" data-step="1" aria-label="Increase clear keycaps">
        &#9650;
      </button>
    </div>
  </div>
  </div>
</section>
<section class="cta">
<div class="cta__price">
  <div class="price-row">
    <span class="price">$24</span>
  </div>
</div>
<button type="button" class="buy" id="add-to-cart">Add to cart</button>
</section>
<div class="porch-logic-mark">porchLogic</div>
</main>
<footer class="page-footer">&copy; 2025 Porch Logic</footer>
<div id="glyph-modal" class="glyph-modal hidden">
  <div class="glyph-modal-inner card">
    <header class="glyph-modal-header">
      <h2>Custom AM8 Glyph</h2>
    </header>
    <p class="glyph-modal-subtitle">Sculpt your glyph by clicking and dragging.</p>
    <div id="glyph-modal-editor" class="glyph-modal-editor"></div>
    <button type="button" class="glyph-modal-close" aria-label="Close glyph editor">Close</button>
  </div>
</div>
<dialog id="cart-popup" aria-labelledby="cart-popup-title">
  <article>
    <header>
      <h2 id="cart-popup-title">Cart updated</h2>
    </header>
    <p id="popup-message"></p>
    <footer>
      <button type="button" class="secondary" data-close-cart>Keep browsing</button>
      <a href="../cart/" role="button">Go to cart</a>
    </footer>
  </article>
</dialog>
<script src="/runtime/shop.js"></script>
</body>
</html>
