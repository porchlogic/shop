  checkout:
    subscribe_label: Subscribe to updates from porchLogic
    policy_links:
      - privacy
      - refund
      - terms
    policy_date_source: client_locale_date
    stripe_js_url: https://js.stripe.com/basil/stripe.js
  
  policies:
    #todo review our policies and find one or two points that are dangerous (if any)

    privacy:
      title: Privacy Policy
      intro: We collect only the information needed to process your order and operate this website.
      sections:
        - title: Information We Collect
          items:
            - Name, email address, and shipping address.
            - Payment details (processed securely by Stripe; we do not store card numbers).
            - Order history and basic site usage data (for example, server logs).
        - title: How We Use This Information
          items:
            - Process and ship orders.
            - Communicate about purchases.
            - Maintain internal records and prevent fraud.
            - We do not sell or share personal information with third parties, except for essential service providers such as Stripe and shipping carriers.
        - title: Data Retention
          items:
            - Order information is kept for business records, accounting, and legal compliance.
            - We retain only what is necessary.
        - title: Cookies
          items:
            - We may use basic session cookies to support site functionality.
            - We do not use ad tracking cookies unless otherwise noted.
        - title: Your Rights
          items:
            - Contact us to access, update, or delete personal information where legally permitted.
        - title: Contact
          items:
            - Email support@porchlogic.com with questions about this policy.

    refund:
      title: Refund and Return Policy
      intro: We aim to make sure our products reach you in good condition. Because we produce small-batch items, we keep returns simple and minimal.
      sections:
        - title: All Sales Final
          items:
            - All purchases are final unless the item arrives defective or damaged.
        - title: Defective or Damaged Items
          items:
            - Contact us within 7 days of delivery with your order number and a description of the issue.
            - Approved cases may receive a replacement, repair, or refund at our discretion.
        - title: Return Shipping
          items:
            - We cover return shipping for defective or damaged items when a return is required.
            - Customers are responsible for shipping costs for other reasons.
        - title: Non-Returnable Items
          items:
            - Custom or personalized items.
            - Digital products (if applicable).
            - Items showing signs of modification or misuse.
        - title: How to Start a Return
          items:
            - Email support@porchlogic.com with your order number and details about the issue.

    terms:
      title: Terms of Service
      sections:
        - title: Use of This Website
          items:
            - This site and its content are provided on an "as is" basis.
            - We may update products, pricing, or site features at any time without notice.
        - title: Orders and Payment
          items:
            - Orders are processed after successful payment.
            - We reserve the right to refuse or cancel an order if an item is unavailable or there is a pricing or listing error.
        - title: Returns and Refunds
          items:
            - Our return and refund policy is described in the Refund and Return Policy.
            - By purchasing from this site, you agree to those terms.
        - title: Shipping
          items:
            - Shipping timelines and methods are described on the Shipping page.
            - Once a package is handed to the carrier, risk of loss transfers to the customer.
            - International customers are responsible for import taxes or duties.
        - title: Product Use
          items:
            - Products are intended for personal use.
            - You agree not to misuse products or attempt unsafe modifications.
        - title: Account and Contact
          items:
            - If you have questions about these Terms, contact support@porchlogic.com.
            - We may update these Terms from time to time. Continued use of the site constitutes acceptance of the updated Terms.

