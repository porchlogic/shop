# ------------------------------
modules:

  # element modules
  h1:
    -  # no value here means it passes the value, and the html is defined in the script (or maybe in a html module file?)
  h2:
  p:
  a:

  # block modules
  header:
    h1: # no value here means it uses the value passed to it
    nav: [] # no values here means it uses the values passed to it
  nav:
    options:
      shop:
        a: "/" # means a simple html a element with href "/" will be output
      cart_icon: # make a cart_icon html chunk in the src folder which defines the rest
        href: "/cart"
        img: cart-icon.svg
    # no module or html element means it must be defined in script (or html module file?)
  content:
    - content here
  footer:
    - copyright porchlogic
  attributes:
    - flexbox of attribs

  # page modules
  product_page:
    data: # define the expected data passed to us
      product: content.products # means the value of data.product is used as lookup in content.products
    modules:
      - header: # header is a module
          # so the resolved value of h1 below gets passed to the modules.header.h1
          h1: data.product.name 
          nav: [shop, cart_icon]
      - carousel: product.images
      - a: 
        - text: "Video"
        - href: product.links.video
        - style: product-video-link
      - attributes: product.attributes
      - add_ons: product.add_ons
      - row:
          - price: product.price
          - button: Add to cart
      - page_footer


# ------------------------------
pages:

  /:
    - header: # is a module
        h1: Shop # means pass "Shop" to the `h1` of the header module
        nav: [cart_icon] # means pass a list of some items that are in the options of the nav module
    - product_grid:
        products:
          - m8_plate_1
          - m8_backpack_1
          - m8_kit_1
    - cart_block # is a string
    - checkout_button
    - site_footer

  /m8-plate:
    - product_page: # is a module
        data: # data passed to the module
          product: m8_plate_1
          # for the editor UI,
            # this will get the data definition from the module (product_page.data in this case)
            # so that when you type 'product: ',
            # it brings up the content.products as the options for the scalar value

  /m8-backpack:
    - product_page: m8_backpack_1

  /m8-kit:
    - product_page: m8_kit_1
        
  /cart:
    - header:
      h1: "Cart"
      nav: [pages.shop]
    - content:
      - row:
        - items
        - summary
      - row:
        - checkout_button
        - continue_shopping_button
    - footer

  /checkout:
    body_class: checkout-page
    modules: 
      - checkout_page

  /stripe/return.html:
    body_class: return-page
    modules: 
      - stripe_return_page


# ------------------------------
parser:
  parseSite():
    for page in yaml.pages:
      - parse each module in the page

  parseModule(name, data):
    - get the module from yaml.modules[name]
    - if it is a list, try parseModule() on each item
    - else if it has `modules` list, try parseModules() on each of those
    - else:
      - for each object in the module: #e.g. h1 and nav in header module
        - check if data has a object of the same name
        - try to output using html elements or html modules with the same name


backend:
