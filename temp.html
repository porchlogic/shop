<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Offline Outliner</title>
	<style>
		:root {
			--bg: #0f1115;
			--panel: #151922;
			--panel2: #0c0f15;
			--text: #e7e9ee;
			--muted: #9aa3b2;
			--accent: #6aa7ff;
			--line: #232a37;
			--focus: #2a3550;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		.app {
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		header {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 10px 12px;
			background: linear-gradient(180deg, var(--panel), var(--panel2));
			border-bottom: 1px solid var(--line);
			position: sticky;
			top: 0;
			z-index: 10;
		}

		.brand {
			font-weight: 650;
			letter-spacing: .2px;
			opacity: .95;
			white-space: nowrap;
		}

		.breadcrumbs {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			align-items: center;
			min-width: 0;
			flex: 1;
		}

		.crumb {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 4px 8px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: rgba(255, 255, 255, .03);
			color: var(--text);
			cursor: pointer;
			max-width: 220px;
			user-select: none;
		}

		.crumb:hover {
			border-color: #2f3a50;
		}

		.crumb .label {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			display: inline-block;
			max-width: 180px;
		}

		.sep {
			color: var(--muted);
			opacity: .8;
			user-select: none;
		}

		.toolbar {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		button {
			background: rgba(255, 255, 255, .04);
			border: 1px solid var(--line);
			color: var(--text);
			border-radius: 10px;
			padding: 7px 10px;
			cursor: pointer;
			user-select: none;
		}

		button:hover {
			border-color: #2f3a50;
		}

		button:active {
			transform: translateY(1px);
		}

		.hint {
			color: var(--muted);
			font-size: 12px;
			white-space: nowrap;
			display: none;
		}

		@media (min-width: 920px) {
			.hint {
				display: block;
			}
		}

		main {
			flex: 1;
			overflow: auto;
			padding: 12px;
		}

		.canvas {
			max-width: 900px;
			margin: 0 auto;
		}

		.list {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.node {
			display: flex;
			align-items: flex-start;
			gap: 8px;
			padding: 4px 6px;
			border-radius: 10px;
			position: relative;
		}

		.node:hover {
			background: rgba(255, 255, 255, .02);
		}

		.node.focused {
			background: rgba(106, 167, 255, .10);
			outline: 1px solid rgba(106, 167, 255, .25);
		}

		.indent {
			width: 0;
			flex: 0 0 auto;
		}

		.bullet {
			width: 18px;
			height: 18px;
			border-radius: 999px;
			border: 1px solid var(--line);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			margin-top: 2px;
			cursor: pointer;
			user-select: none;
			color: var(--muted);
			background: rgba(255, 255, 255, .02);
			flex: 0 0 auto;
		}

		.bullet:hover {
			border-color: #2f3a50;
			color: var(--text);
		}

		.bullet.has-children {
			border-color: #2f3a50;
			color: var(--text);
		}

		.bullet .tri {
			display: block;
			width: 0;
			height: 0;
			border-style: solid;
			border-width: 4.5px 0 4.5px 6.5px;
			border-color: transparent transparent transparent currentColor;
			transform: translateX(1px);
			opacity: .95;
		}

		.bullet.collapsed .tri {
			transform: translateX(1px) rotate(0deg);
		}

		.bullet.expanded .tri {
			transform: translateX(1px) rotate(90deg);
		}

		.text {
			flex: 1;
			min-width: 0;
			padding: 3px 8px;
			border-radius: 8px;
			outline: none;
			white-space: pre-wrap;
			word-break: break-word;
			color: var(--text);
		}

		.text:empty:before {
			content: "";
		}

		.text.placeholder:before {
			content: "Type…";
			color: rgba(154, 163, 178, .55);
		}

		.meta {
			display: flex;
			align-items: center;
			gap: 6px;
			color: var(--muted);
			font-size: 12px;
			user-select: none;
		}

		.kbd {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
			border: 1px solid var(--line);
			border-bottom-color: #1b2130;
			background: rgba(255, 255, 255, .03);
			padding: 1px 6px;
			border-radius: 7px;
			color: var(--muted);
		}

		.footer {
			color: var(--muted);
			font-size: 12px;
			padding: 10px 12px;
			border-top: 1px solid var(--line);
			background: rgba(0, 0, 0, .15);
		}

		.smalllink {
			color: var(--accent);
			cursor: pointer;
			text-decoration: none;
		}

		.smalllink:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="app">
		<header>
			<div class="brand">Offline Outliner</div>
			<div class="breadcrumbs" id="breadcrumbs"></div>
			<div class="toolbar">
				<button id="btnZoomOut" title="Zoom out (Esc)">Zoom out</button>
				<button id="btnNew" title="New top-level item">New</button>
				<button id="btnExport" title="Export JSON">Export</button>
				<button id="btnImport" title="Import JSON">Import</button>
			</div>
			<div class="hint">
				<span class="kbd">Enter</span> new
				<span class="kbd">Tab</span>/<span class="kbd">Shift+Tab</span> indent
				<span class="kbd">Ctrl+Enter</span> zoom
				<span class="kbd">Esc</span> out
				<span class="kbd">Ctrl+\</span> collapse
			</div>
		</header>

		<main>
			<div class="canvas">
				<ul class="list" id="list"></ul>
			</div>
		</main>

		<div class="footer">
			Data lives in <span class="kbd">localStorage</span> only. No network usage.
			&nbsp;•&nbsp;<a class="smalllink" href="#" id="btnReset">Reset document</a>
		</div>
	</div>

	<script>
		/*
			Data model (simple + Workflowy-like):
			{
				rootId: "root",
				nodes: {
					"id": { id, parentId, text, collapsed, children:[id...] }
				},
				zoomId: "root",
				focusId: "someNodeId"
			}
		*/
		(() => {
			"use strict";

			const STORAGE_KEY = "offline_outliner_v1";

			const $ = (sel) => document.querySelector(sel);

			const elList = $("#list");
			const elBreadcrumbs = $("#breadcrumbs");

			const btnZoomOut = $("#btnZoomOut");
			const btnNew = $("#btnNew");
			const btnExport = $("#btnExport");
			const btnImport = $("#btnImport");
			const btnReset = $("#btnReset");

			let state = loadState();
			let renderQueued = false;
			let saveTimer = null;

			function uid() {
				return Math.random().toString(16).slice(2) + Date.now().toString(16);
			}

			function defaultState() {
				const rootId = "root";
				const id1 = uid();
				const id2 = uid();
				return {
					rootId,
					zoomId: rootId,
					focusId: id1,
					nodes: {
						[rootId]: { id: rootId, parentId: null, text: "Home", collapsed: false, children: [id1, id2] },
						[id1]: { id: id1, parentId: rootId, text: "Type to edit. Enter makes a new bullet.", collapsed: false, children: [] },
						[id2]: { id: id2, parentId: rootId, text: "Ctrl+Enter zooms into a bullet. Esc zooms out.", collapsed: false, children: [] }
					}
				};
			}

			function loadState() {
				try {
					const raw = localStorage.getItem(STORAGE_KEY);
					if (!raw) return defaultState();
					const parsed = JSON.parse(raw);
					if (!parsed || !parsed.nodes || !parsed.rootId) return defaultState();
					if (!parsed.nodes[parsed.rootId]) return defaultState();
					if (!parsed.zoomId || !parsed.nodes[parsed.zoomId]) parsed.zoomId = parsed.rootId;
					if (!parsed.focusId || !parsed.nodes[parsed.focusId]) parsed.focusId = parsed.zoomId;
					return parsed;
				} catch {
					return defaultState();
				}
			}

			function scheduleSave() {
				if (saveTimer) clearTimeout(saveTimer);
				saveTimer = setTimeout(() => {
					try {
						localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
					} catch (e) {
						console.warn("Save failed:", e);
					}
				}, 150);
			}

			function getAncestors(id) {
				const chain = [];
				let cur = id;
				while (cur) {
					chain.push(cur);
					const n = state.nodes[cur];
					cur = n ? n.parentId : null;
				}
				chain.reverse();
				return chain;
			}

			function ensureInZoom(id) {
				// If focused node is not within zoom subtree, focus zoom node.
				if (!isDescendantOrSelf(id, state.zoomId)) {
					state.focusId = state.zoomId;
				}
			}

			function isDescendantOrSelf(id, ancestorId) {
				if (id === ancestorId) return true;
				let cur = state.nodes[id];
				while (cur) {
					if (cur.parentId === ancestorId) return true;
					cur = cur.parentId ? state.nodes[cur.parentId] : null;
				}
				return false;
			}

			function visibleChildren(nodeId) {
				const n = state.nodes[nodeId];
				if (!n) return [];
				if (n.collapsed) return [];
				return n.children || [];
			}

			function render() {
				renderQueued = false;

				ensureInZoom(state.focusId);

				// Breadcrumbs
				const chain = getAncestors(state.zoomId);
				elBreadcrumbs.innerHTML = "";
				for (let i = 0; i < chain.length; i++) {
					const id = chain[i];
					const n = state.nodes[id];
					const crumb = document.createElement("div");
					crumb.className = "crumb";
					crumb.title = "Zoom to this node";
					const label = document.createElement("span");
					label.className = "label";
					label.textContent = (n && n.text && n.text.trim()) ? n.text.trim() : (id === state.rootId ? "Home" : "Untitled");
					crumb.appendChild(label);
					crumb.addEventListener("click", () => {
						state.zoomId = id;
						state.focusId = id;
						scheduleSave();
						queueRender(true);
					});
					elBreadcrumbs.appendChild(crumb);
					if (i < chain.length - 1) {
						const sep = document.createElement("span");
						sep.className = "sep";
						sep.textContent = "›";
						elBreadcrumbs.appendChild(sep);
					}
				}

				// List
				elList.innerHTML = "";
				const zoomNode = state.nodes[state.zoomId];
				const top = (zoomNode && zoomNode.children) ? zoomNode.children : [];
				for (const childId of top) {
					elList.appendChild(renderNode(childId, 0));
				}

				// Focus restore
				focusNode(state.focusId, false);
			}

			function queueRender(keepCaret) {
				if (renderQueued) return;
				renderQueued = true;
				requestAnimationFrame(() => {
					// If we need to keep caret, we capture selection before and restore after.
					let selInfo = null;
					if (keepCaret) {
						selInfo = captureSelection();
					}
					render();
					if (selInfo) {
						restoreSelection(selInfo);
					}
				});
			}

			function renderNode(id, depth) {
				const n = state.nodes[id];
				const li = document.createElement("li");

				const row = document.createElement("div");
				row.className = "node";
				row.dataset.id = id;

				const indent = document.createElement("div");
				indent.className = "indent";
				indent.style.width = (depth * 22) + "px";

				const bullet = document.createElement("div");
				bullet.className = "bullet";
				const hasChildren = (n.children && n.children.length > 0);
				if (hasChildren) bullet.classList.add("has-children");
				const tri = document.createElement("span");
				tri.className = "tri";
				bullet.appendChild(tri);

				if (hasChildren) {
					bullet.classList.add(n.collapsed ? "collapsed" : "expanded");
				} else {
					// show a dot instead of triangle
					tri.style.borderWidth = "3.5px";
					tri.style.borderColor = "currentColor";
					tri.style.borderStyle = "solid";
					tri.style.borderRadius = "999px";
					tri.style.width = "4px";
					tri.style.height = "4px";
					tri.style.transform = "translateX(0)";
					tri.style.borderColor = "transparent";
					tri.style.background = "currentColor";
					tri.style.opacity = ".65";
				}

				bullet.addEventListener("click", (e) => {
					e.stopPropagation();
					if (hasChildren) {
						n.collapsed = !n.collapsed;
						scheduleSave();
						queueRender(true);
					} else {
						// no-op
					}
				});

				const text = document.createElement("div");
				text.className = "text";
				text.contentEditable = "true";
				text.spellcheck = false;
				text.dataset.id = id;

				const t = (n.text ?? "");
				text.textContent = t;
				if (!t) text.classList.add("placeholder");

				text.addEventListener("focus", () => {
					state.focusId = id;
					updateFocusedRow();
					scheduleSave();
				});

				text.addEventListener("input", () => {
					const v = text.textContent ?? "";
					n.text = v;
					if (v.trim().length === 0) text.classList.add("placeholder");
					else text.classList.remove("placeholder");
					scheduleSave();
				});

				text.addEventListener("keydown", (e) => onKeyDown(e, id));

				row.addEventListener("click", () => {
					state.focusId = id;
					focusNode(id, true);
				});

				row.appendChild(indent);
				row.appendChild(bullet);
				row.appendChild(text);

				li.appendChild(row);

				if (n.children && n.children.length && !n.collapsed) {
					for (const childId of n.children) {
						li.appendChild(renderNode(childId, depth + 1));
					}
				}
				return li;
			}

			function updateFocusedRow() {
				document.querySelectorAll(".node.focused").forEach(el => el.classList.remove("focused"));
				const row = document.querySelector(`.node[data-id="${cssEscape(state.focusId)}"]`);
				if (row) row.classList.add("focused");
			}

			function focusNode(id, scrollIntoView) {
				const el = document.querySelector(`.text[data-id="${cssEscape(id)}"]`);
				if (!el) return;
				updateFocusedRow();
				el.focus({ preventScroll: !scrollIntoView });
				if (scrollIntoView) {
					const row = el.closest(".node");
					if (row) row.scrollIntoView({ block: "nearest" });
				}
			}

			function cssEscape(s) {
				return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/"/g, '\\"');
			}

			function getParent(id) {
				const n = state.nodes[id];
				if (!n) return null;
				return n.parentId ? state.nodes[n.parentId] : null;
			}

			function indexInParent(id) {
				const n = state.nodes[id];
				if (!n || !n.parentId) return -1;
				const p = state.nodes[n.parentId];
				if (!p || !p.children) return -1;
				return p.children.indexOf(id);
			}

			function insertAfter(parentId, afterId, newId) {
				const p = state.nodes[parentId];
				if (!p) return;
				if (!p.children) p.children = [];
				const idx = afterId ? p.children.indexOf(afterId) : -1;
				const at = (idx >= 0) ? idx + 1 : p.children.length;
				p.children.splice(at, 0, newId);
			}

			function removeFromParent(id) {
				const n = state.nodes[id];
				if (!n || !n.parentId) return;
				const p = state.nodes[n.parentId];
				if (!p || !p.children) return;
				const idx = p.children.indexOf(id);
				if (idx >= 0) p.children.splice(idx, 1);
			}

			function createNode(parentId, text) {
				const id = uid();
				state.nodes[id] = { id, parentId, text: text ?? "", collapsed: false, children: [] };
				return id;
			}

			function deleteNode(id) {
				// delete subtree
				const n = state.nodes[id];
				if (!n) return;
				for (const c of (n.children || [])) {
					deleteNode(c);
				}
				removeFromParent(id);
				delete state.nodes[id];
			}

			function previousVisibleNodeId(id) {
				// Previous in visible traversal within current zoom view
				const ids = visibleTraversalIds();
				const idx = ids.indexOf(id);
				if (idx > 0) return ids[idx - 1];
				return null;
			}

			function nextVisibleNodeId(id) {
				const ids = visibleTraversalIds();
				const idx = ids.indexOf(id);
				if (idx >= 0 && idx < ids.length - 1) return ids[idx + 1];
				return null;
			}

			function visibleTraversalIds() {
				const out = [];
				const zoom = state.nodes[state.zoomId];
				const walk = (id) => {
					out.push(id);
					const n = state.nodes[id];
					if (!n || n.collapsed) return;
					for (const c of (n.children || [])) walk(c);
				};
				for (const c of (zoom.children || [])) walk(c);
				return out;
			}

			function onKeyDown(e, id) {
				const n = state.nodes[id];
				if (!n) return;

				// Navigation up/down (Workflowy-ish)
				if (e.key === "ArrowUp" && !e.ctrlKey && !e.metaKey && !e.altKey) {
					if (isCaretAtLineStart()) {
						const prev = previousVisibleNodeId(id);
						if (prev) {
							e.preventDefault();
							state.focusId = prev;
							queueRender(false);
							setCaretToEnd(prev);
						}
					}
					return;
				}
				if (e.key === "ArrowDown" && !e.ctrlKey && !e.metaKey && !e.altKey) {
					if (isCaretAtLineEnd()) {
						const next = nextVisibleNodeId(id);
						if (next) {
							e.preventDefault();
							state.focusId = next;
							queueRender(false);
							setCaretToStart(next);
						}
					}
					return;
				}

				// Enter: split into new sibling node
				if (e.key === "Enter" && !e.shiftKey) {
					e.preventDefault();
					const { before, after } = splitAtCaret();
					n.text = before;
					const parentId = n.parentId ?? state.zoomId;
					const newId = createNode(parentId, after);
					insertAfter(parentId, id, newId);
					state.focusId = newId;
					scheduleSave();
					queueRender(false);
					requestAnimationFrame(() => setCaretToStart(newId));
					return;
				}

				// Shift+Enter: line break inside node
				if (e.key === "Enter" && e.shiftKey) {
					// allow default newline in contenteditable
					return;
				}

				// Tab / Shift+Tab: indent/outdent
				if (e.key === "Tab") {
					e.preventDefault();
					if (e.shiftKey) {
						outdentNode(id);
					} else {
						indentNode(id);
					}
					scheduleSave();
					queueRender(true);
					return;
				}

				// Backspace on empty node: delete
				if (e.key === "Backspace" && !e.ctrlKey && !e.metaKey && !e.altKey) {
					if ((n.text ?? "").length === 0) {
						e.preventDefault();
						const prev = previousVisibleNodeId(id) || n.parentId || state.zoomId;
						deleteNode(id);
						state.focusId = prev;
						scheduleSave();
						queueRender(false);
						requestAnimationFrame(() => setCaretToEnd(prev));
						return;
					}
					return;
				}

				// Ctrl+Enter: zoom in
				if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
					e.preventDefault();
					zoomIn(id);
					return;
				}

				// Esc: zoom out
				if (e.key === "Escape") {
					e.preventDefault();
					zoomOut();
					return;
				}

				// Ctrl+\ : collapse toggle
				if (e.key === "\\" && (e.ctrlKey || e.metaKey)) {
					e.preventDefault();
					if (n.children && n.children.length) {
						n.collapsed = !n.collapsed;
						scheduleSave();
						queueRender(true);
					}
					return;
				}

				// Ctrl+. : zoom in (alt shortcut)
				if (e.key === "." && (e.ctrlKey || e.metaKey)) {
					e.preventDefault();
					zoomIn(id);
					return;
				}

				// Ctrl+, : zoom out (alt shortcut)
				if (e.key === "," && (e.ctrlKey || e.metaKey)) {
					e.preventDefault();
					zoomOut();
					return;
				}
			}

			function zoomIn(id) {
				state.zoomId = id;
				state.focusId = id;
				scheduleSave();
				queueRender(false);
				requestAnimationFrame(() => focusNode(id, true));
			}

			function zoomOut() {
				if (state.zoomId === state.rootId) return;
				const parentId = state.nodes[state.zoomId]?.parentId;
				if (!parentId) return;
				state.zoomId = parentId;
				state.focusId = parentId;
				scheduleSave();
				queueRender(false);
				requestAnimationFrame(() => focusNode(parentId, true));
			}

			function indentNode(id) {
				const n = state.nodes[id];
				if (!n || !n.parentId) return;

				const p = state.nodes[n.parentId];
				if (!p || !p.children) return;

				const idx = p.children.indexOf(id);
				if (idx <= 0) return; // need a previous sibling to indent under

				const newParentId = p.children[idx - 1];
				const newParent = state.nodes[newParentId];
				if (!newParent) return;

				// remove from current parent
				p.children.splice(idx, 1);

				// add to new parent's children at end
				if (!newParent.children) newParent.children = [];
				newParent.children.push(id);

				n.parentId = newParentId;
				newParent.collapsed = false;
			}

			function outdentNode(id) {
				const n = state.nodes[id];
				if (!n || !n.parentId) return;

				const parent = state.nodes[n.parentId];
				if (!parent || parent.parentId == null) return; // can't outdent above root child list

				const grandId = parent.parentId;
				const grand = state.nodes[grandId];
				if (!grand || !grand.children) return;

				// remove from current parent
				removeFromParent(id);

				// insert after parent in grand's children
				const pIdx = grand.children.indexOf(parent.id);
				const insertAt = (pIdx >= 0) ? (pIdx + 1) : grand.children.length;
				grand.children.splice(insertAt, 0, id);

				n.parentId = grandId;
			}

			// Caret utilities
			function getActiveTextEl() {
				const a = document.activeElement;
				if (a && a.classList && a.classList.contains("text")) return a;
				return null;
			}

			function captureSelection() {
				const el = getActiveTextEl();
				if (!el) return null;
				const id = el.dataset.id;
				const offset = caretOffsetIn(el);
				return { id, offset };
			}

			function restoreSelection(info) {
				const el = document.querySelector(`.text[data-id="${cssEscape(info.id)}"]`);
				if (!el) return;
				el.focus({ preventScroll: true });
				setCaretOffsetIn(el, info.offset);
			}

			function caretOffsetIn(el) {
				const sel = window.getSelection();
				if (!sel || sel.rangeCount === 0) return 0;
				const range = sel.getRangeAt(0);
				const pre = range.cloneRange();
				pre.selectNodeContents(el);
				pre.setEnd(range.endContainer, range.endOffset);
				return pre.toString().length;
			}

			function setCaretOffsetIn(el, offset) {
				el.focus({ preventScroll: true });
				const range = document.createRange();
				range.selectNodeContents(el);
				range.collapse(true);

				let remaining = offset;
				const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
				let node = walker.nextNode();
				while (node) {
					const len = node.nodeValue.length;
					if (remaining <= len) {
						range.setStart(node, remaining);
						range.collapse(true);
						break;
					}
					remaining -= len;
					node = walker.nextNode();
				}
				const sel = window.getSelection();
				sel.removeAllRanges();
				sel.addRange(range);
			}

			function isCaretAtLineStart() {
				const el = getActiveTextEl();
				if (!el) return false;
				return caretOffsetIn(el) === 0;
			}
			function isCaretAtLineEnd() {
				const el = getActiveTextEl();
				if (!el) return false;
				const text = el.textContent ?? "";
				return caretOffsetIn(el) >= text.length;
			}

			function splitAtCaret() {
				const el = getActiveTextEl();
				if (!el) return { before: "", after: "" };
				const full = el.textContent ?? "";
				const off = caretOffsetIn(el);
				return {
					before: full.slice(0, off),
					after: full.slice(off)
				};
			}

			function setCaretToEnd(id) {
				const el = document.querySelector(`.text[data-id="${cssEscape(id)}"]`);
				if (!el) return;
				const t = el.textContent ?? "";
				el.focus({ preventScroll: false });
				setCaretOffsetIn(el, t.length);
			}

			function setCaretToStart(id) {
				const el = document.querySelector(`.text[data-id="${cssEscape(id)}"]`);
				if (!el) return;
				el.focus({ preventScroll: false });
				setCaretOffsetIn(el, 0);
			}

			// Buttons
			btnZoomOut.addEventListener("click", () => zoomOut());

			btnNew.addEventListener("click", () => {
				const zoom = state.nodes[state.zoomId];
				const parentId = state.zoomId;
				const newId = createNode(parentId, "");
				zoom.children = zoom.children || [];
				zoom.children.push(newId);
				state.focusId = newId;
				scheduleSave();
				queueRender(false);
				requestAnimationFrame(() => setCaretToStart(newId));
			});

			btnExport.addEventListener("click", async () => {
				const raw = JSON.stringify(state, null, 2);
				await showModalText("Export JSON", raw);
			});

			btnImport.addEventListener("click", async () => {
				const raw = await promptModalText("Import JSON", "Paste previously exported JSON here.");
				if (!raw) return;
				try {
					const parsed = JSON.parse(raw);
					if (!parsed || !parsed.nodes || !parsed.rootId || !parsed.nodes[parsed.rootId]) throw new Error("Invalid document");
					state = parsed;
					if (!state.zoomId || !state.nodes[state.zoomId]) state.zoomId = state.rootId;
					if (!state.focusId || !state.nodes[state.focusId]) state.focusId = state.zoomId;
					localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
					queueRender(false);
				} catch (e) {
					alert("Import failed: " + (e?.message || String(e)));
				}
			});

			btnReset.addEventListener("click", (e) => {
				e.preventDefault();
				if (!confirm("Reset document and delete local data?")) return;
				state = defaultState();
				localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
				queueRender(false);
			});

			// Global key: Esc zoom out even if not focused in text
			window.addEventListener("keydown", (e) => {
				if (e.key === "Escape") {
					const ae = document.activeElement;
					// Only intercept if we're inside the app (not in modal)
					if (!document.body.classList.contains("modal-open")) {
						e.preventDefault();
						zoomOut();
					}
				}
			});

			// Minimal modal helpers (offline)
			function modalBase(title) {
				const overlay = document.createElement("div");
				overlay.style.position = "fixed";
				overlay.style.inset = "0";
				overlay.style.background = "rgba(0,0,0,.55)";
				overlay.style.display = "flex";
				overlay.style.alignItems = "center";
				overlay.style.justifyContent = "center";
				overlay.style.padding = "14px";
				overlay.style.zIndex = "9999";

				const panel = document.createElement("div");
				panel.style.width = "min(880px, 100%)";
				panel.style.background = "var(--panel)";
				panel.style.border = "1px solid var(--line)";
				panel.style.borderRadius = "14px";
				panel.style.boxShadow = "0 20px 80px rgba(0,0,0,.45)";
				panel.style.overflow = "hidden";

				const head = document.createElement("div");
				head.style.display = "flex";
				head.style.alignItems = "center";
				head.style.justifyContent = "space-between";
				head.style.padding = "10px 12px";
				head.style.borderBottom = "1px solid var(--line)";
				head.style.background = "linear-gradient(180deg,var(--panel),var(--panel2))";

				const h = document.createElement("div");
				h.textContent = title;
				h.style.fontWeight = "650";

				const close = document.createElement("button");
				close.textContent = "Close";
				close.style.borderRadius = "10px";

				head.appendChild(h);
				head.appendChild(close);

				panel.appendChild(head);
				overlay.appendChild(panel);

				close.addEventListener("click", () => {
					document.body.classList.remove("modal-open");
					overlay.remove();
				});
				overlay.addEventListener("click", (e) => {
					if (e.target === overlay) {
						document.body.classList.remove("modal-open");
						overlay.remove();
					}
				});

				return { overlay, panel, close };
			}

			async function showModalText(title, text) {
				return new Promise((resolve) => {
					document.body.classList.add("modal-open");
					const { overlay, panel, close } = modalBase(title);

					const body = document.createElement("div");
					body.style.padding = "12px";

					const ta = document.createElement("textarea");
					ta.value = text;
					ta.readOnly = true;
					ta.style.width = "100%";
					ta.style.height = "60vh";
					ta.style.resize = "vertical";
					ta.style.background = "rgba(0,0,0,.15)";
					ta.style.border = "1px solid var(--line)";
					ta.style.color = "var(--text)";
					ta.style.borderRadius = "12px";
					ta.style.padding = "10px";
					ta.style.fontFamily = "ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace";
					ta.style.fontSize = "12px";

					const row = document.createElement("div");
					row.style.display = "flex";
					row.style.gap = "10px";
					row.style.marginTop = "10px";
					row.style.justifyContent = "flex-end";

					const copy = document.createElement("button");
					copy.textContent = "Copy";
					copy.addEventListener("click", async () => {
						try {
							await navigator.clipboard.writeText(text);
							copy.textContent = "Copied";
							setTimeout(() => copy.textContent = "Copy", 900);
						} catch {
							ta.select();
							document.execCommand("copy");
						}
					});

					row.appendChild(copy);
					body.appendChild(ta);
					body.appendChild(row);

					panel.appendChild(body);
					document.body.appendChild(overlay);

					close.addEventListener("click", () => resolve());
				});
			}

			async function promptModalText(title, subtitle) {
				return new Promise((resolve) => {
					document.body.classList.add("modal-open");
					const { overlay, panel, close } = modalBase(title);

					const body = document.createElement("div");
					body.style.padding = "12px";

					const sub = document.createElement("div");
					sub.textContent = subtitle;
					sub.style.color = "var(--muted)";
					sub.style.marginBottom = "10px";
					sub.style.fontSize = "12px";

					const ta = document.createElement("textarea");
					ta.placeholder = "{ ... }";
					ta.style.width = "100%";
					ta.style.height = "50vh";
					ta.style.resize = "vertical";
					ta.style.background = "rgba(0,0,0,.15)";
					ta.style.border = "1px solid var(--line)";
					ta.style.color = "var(--text)";
					ta.style.borderRadius = "12px";
					ta.style.padding = "10px";
					ta.style.fontFamily = "ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace";
					ta.style.fontSize = "12px";

					const row = document.createElement("div");
					row.style.display = "flex";
					row.style.gap = "10px";
					row.style.marginTop = "10px";
					row.style.justifyContent = "flex-end";

					const cancel = document.createElement("button");
					cancel.textContent = "Cancel";
					cancel.addEventListener("click", () => {
						document.body.classList.remove("modal-open");
						overlay.remove();
						resolve(null);
					});

					const ok = document.createElement("button");
					ok.textContent = "Import";
					ok.addEventListener("click", () => {
						const v = ta.value.trim();
						document.body.classList.remove("modal-open");
						overlay.remove();
						resolve(v || null);
					});

					row.appendChild(cancel);
					row.appendChild(ok);

					body.appendChild(sub);
					body.appendChild(ta);
					body.appendChild(row);

					panel.appendChild(body);
					document.body.appendChild(overlay);

					setTimeout(() => ta.focus(), 0);
					close.addEventListener("click", () => resolve(null));
				});
			}

			// Initial render
			queueRender(false);
			updateFocusedRow();
		})();
	</script>
</body>

</html>
